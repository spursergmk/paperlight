# Builds Paperlight for macOS, Windows and Linux.
#
#   * every push to a v* tag builds all three platforms and attaches the
#     installers to a draft GitHub Release
#   * "Run workflow" builds them without publishing, and the artifacts can be
#     downloaded from the run page
#
# No signing secrets are required: without them the builds are unsigned, and the
# recipient has to confirm once (macOS: right-click → Open; Windows: 更多信息 →
# 仍要运行). Add the secrets below to get warning-free installers:
#   macOS  CSC_LINK, CSC_KEY_PASSWORD (Developer ID .p12),
#          APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#   Windows  WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD (code-signing .p12)

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --mac
          - name: Windows (x64)
            os: windows-latest
            args: --win
          - name: Linux (x64)
            os: ubuntu-latest
            args: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, build renderer and run unit tests
        run: npm run check

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paperlight-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

      - name: Attach installers to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
